name: Docker Publish (GHCR & Docker Hub)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标 (all / master / agent)'
        required: false
        default: 'all'
      tag:
        description: '自定义镜像标签 (留空则按真实版本自动推导，例如 v0.9.4)'
        required: false
        default: ''

concurrency:
  group: docker-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 构建并发布镜像至 GHCR 与 Docker Hub (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: 设置 Node.js 环境 (提取版本号)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析镜像元数据与标签
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

          DOCKERHUB_USER_LC=""
          HAS_DOCKERHUB="false"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            DOCKERHUB_USER_LC="$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')"
            HAS_DOCKERHUB="true"
          fi
          echo "has_dockerhub=${HAS_DOCKERHUB}" >> "$GITHUB_OUTPUT"

          VERSION="$(node -p "require('./package.json').version")"
          if [ -f "apps/agent/VERSION" ]; then
            AGENT_VERSION="$(tr -d '[:space:]' < apps/agent/VERSION)"
          else
            AGENT_VERSION="$VERSION"
          fi

          echo "vcs_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

          REF="${{ github.ref }}"
          EVENT_NAME="${{ github.event_name }}"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          CUSTOM_TAG="${{ inputs.tag }}"
          TARGET_INPUT="${{ inputs.target }}"
          [ -n "$TARGET_INPUT" ] || TARGET_INPUT="all"

          TAG_NAME=""
          if [ -n "$RELEASE_TAG" ]; then
            TAG_NAME="$RELEASE_TAG"
          elif [[ "$REF" =~ ^refs/tags/ ]]; then
            TAG_NAME="${REF#refs/tags/}"
          fi

          BUILD_MASTER="false"
          BUILD_AGENT="false"
          MASTER_TAGS=()
          AGENT_TAGS=()

          append_master_tags() {
            local tag="$1"
            MASTER_TAGS+=("ghcr.io/${OWNER_LC}/riricloud-master:${tag}")
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              MASTER_TAGS+=("${DOCKERHUB_USER_LC}/riricloud-master:${tag}")
            fi
          }

          append_agent_tags() {
            local tag="$1"
            AGENT_TAGS+=("ghcr.io/${OWNER_LC}/riricloud-agent:${tag}")
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              AGENT_TAGS+=("${DOCKERHUB_USER_LC}/riricloud-agent:${tag}")
            fi
          }

          if [[ "$TAG_NAME" =~ ^v[0-9] ]]; then
            # 正式发布 Master Release (如 v0.9.4)：严格双轨解耦，仅构建 Master 镜像
            RAW_VER="${TAG_NAME#v}"
            VERSION="$RAW_VER"
            BUILD_MASTER="true"
            append_master_tags "${TAG_NAME}"
            append_master_tags "${RAW_VER}"
            append_master_tags "latest"
          elif [[ "$TAG_NAME" =~ ^agent-v[0-9] ]]; then
            # 独立发布 Agent Release (如 agent-v0.8.4)：严格双轨解耦，仅构建 Agent 镜像
            RAW_VER="${TAG_NAME#agent-v}"
            AGENT_VERSION="$RAW_VER"
            BUILD_AGENT="true"
            append_agent_tags "${TAG_NAME}"
            append_agent_tags "v${RAW_VER}"
            append_agent_tags "${RAW_VER}"
            append_agent_tags "latest"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TARGET_INPUT" = "all" ] || [ "$TARGET_INPUT" = "master" ]; then
              BUILD_MASTER="true"
              if [ -n "$CUSTOM_TAG" ]; then
                append_master_tags "${CUSTOM_TAG}"
              else
                append_master_tags "v${VERSION}"
                append_master_tags "${VERSION}"
                append_master_tags "latest"
              fi
            fi
            if [ "$TARGET_INPUT" = "all" ] || [ "$TARGET_INPUT" = "agent" ]; then
              BUILD_AGENT="true"
              if [ -n "$CUSTOM_TAG" ]; then
                append_agent_tags "${CUSTOM_TAG}"
              else
                append_agent_tags "agent-v${AGENT_VERSION}"
                append_agent_tags "v${AGENT_VERSION}"
                append_agent_tags "${AGENT_VERSION}"
                append_agent_tags "latest"
              fi
            fi
          else
            echo "::warning::未匹配到有效的发布版本 Tag (${TAG_NAME:-$REF})，跳过镜像构建"
          fi

          MASTER_TAGS_STR=$(IFS=,; echo "${MASTER_TAGS[*]}")
          AGENT_TAGS_STR=$(IFS=,; echo "${AGENT_TAGS[*]}")

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "agent_version=${AGENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "master_tags=${MASTER_TAGS_STR}" >> "$GITHUB_OUTPUT"
          echo "agent_tags=${AGENT_TAGS_STR}" >> "$GITHUB_OUTPUT"
          echo "build_master=${BUILD_MASTER}" >> "$GITHUB_OUTPUT"
          echo "build_agent=${BUILD_AGENT}" >> "$GITHUB_OUTPUT"

      - name: 设置 Docker Buildx
        if: steps.meta.outputs.build_master == 'true' || steps.meta.outputs.build_agent == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: steps.meta.outputs.build_master == 'true' || steps.meta.outputs.build_agent == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: (steps.meta.outputs.build_master == 'true' || steps.meta.outputs.build_agent == 'true') && steps.meta.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 Master 镜像 (GHCR & Docker Hub)
        if: steps.meta.outputs.build_master == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.master_tags }}
          build-args: |
            TARGETARCH=amd64
            RIRICLOUD_VERSION=${{ steps.meta.outputs.version }}
            RIRICLOUD_VCS_REF=${{ steps.meta.outputs.vcs_ref }}
            RIRICLOUD_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            RIRICLOUD_IMAGE_TAGS=${{ steps.meta.outputs.master_tags }}
          cache-from: type=gha,scope=docker-master
          cache-to: type=gha,mode=max,scope=docker-master

      - name: 构建并推送 Agent 镜像 (GHCR & Docker Hub)
        if: steps.meta.outputs.build_agent == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.agent_tags }}
          build-args: |
            TARGETARCH=amd64
            RIRICLOUD_VERSION=${{ steps.meta.outputs.agent_version }}
            RIRICLOUD_VCS_REF=${{ steps.meta.outputs.vcs_ref }}
            RIRICLOUD_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            RIRICLOUD_IMAGE_TAGS=${{ steps.meta.outputs.agent_tags }}
          cache-from: type=gha,scope=docker-agent
          cache-to: type=gha,mode=max,scope=docker-agent
