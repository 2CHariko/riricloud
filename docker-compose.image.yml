# RiriCloud 预构建镜像部署模板：适用于离线镜像包导入或从 Docker Hub / GHCR (GitHub Packages) 在线拉取。
# 在线镜像示例（在 .env.image 或环境变量中指定）：
#   方式 1 (Docker Hub):
#     MASTER_IMAGE=<dockerhub_user>/riricloud-master:latest
#     AGENT_IMAGE=<dockerhub_user>/riricloud-agent:latest
#   方式 2 (GHCR):
#     MASTER_IMAGE=ghcr.io/<owner>/riricloud-master:latest
#     AGENT_IMAGE=ghcr.io/<owner>/riricloud-agent:latest
#   IMAGE_PULL_POLICY=if_not_present (或 always)
#   DOCKER_USER=0:0 (可选：若在 VPS 以 root 部署出现挂载目录权限问题，可设为 0:0 免改宿主目录权限)
name: riricloud

services:
  master:
    image: ${MASTER_IMAGE:-riricloud/master:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    restart: unless-stopped
    user: "${DOCKER_USER:-65532:65532}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # Linux/WSL 下使用 host network，让内置 Agent 的动态 TCP/UDP 线路端口直接暴露。
    network_mode: host
    environment:
      PORT: ${MASTER_PORT:-3000}
      DATABASE_URL: file:/app/data/riri.db
      TELEMETRY_DATABASE_URL: file:/app/data/telemetry.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.image}
      AUTO_SEED: ${AUTO_SEED:-false}
      MASTER_LOCAL_HOST: ${MASTER_LOCAL_HOST:-}
      MASTER_LOCAL_AGENT_TOKEN: ${MASTER_LOCAL_AGENT_TOKEN:-}
      AGENT_IMAGE: ${AGENT_IMAGE:-riricloud/agent:latest}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      RIRICLOUD_PUBLIC_URL: ${RIRICLOUD_PUBLIC_URL:-}
      RIRICLOUD_ENCRYPTION_KEY: ${RIRICLOUD_ENCRYPTION_KEY:?RIRICLOUD_ENCRYPTION_KEY must be set in .env.image}
      RIRICLOUD_TRUST_PROXY: ${RIRICLOUD_TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    volumes:
      - ${MASTER_DATA_PATH:-./data}:/app/data
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  agent:
    image: ${AGENT_IMAGE:-riricloud/agent:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    restart: unless-stopped
    command: ["run"]
    user: "${DOCKER_USER:-65532:65532}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    network_mode: host
    depends_on:
      master:
        condition: service_healthy
    environment:
      AGENT_TOKEN: ${MASTER_LOCAL_AGENT_TOKEN:-${AGENT_TOKEN:-}}
      MASTER_URL: ${AGENT_MASTER_URL:-ws://127.0.0.1:${MASTER_PORT:-3000}/ws/agent}
      AGENT_MODE: ${AGENT_MODE:-ws}
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS:-15}
      RIRICLOUD_ENV: ${RIRICLOUD_ENV:-production}
    volumes:
      - ${AGENT_DATA_PATH:-./data/agent}:/var/lib/riri-agent
